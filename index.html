<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>课文随身学 · 英语课文讲解与练习</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --bg: #f2f5fc;
    --card: #ffffff;
    --text: #243044;
    --muted: #7b8798;
    --ok: #1f9d63;
    --ok-bg: #e5f7ee;
    --bad: #d24b3f;
    --bad-bg: #fdecea;
    --gold: #f5a623;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #4f6ef7 0%, #6f86ff 55%, #8aa4ff 100%);
    color: #fff; padding: 18px 16px 14px; box-shadow: 0 2px 10px rgba(79,110,247,.25);
  }
  .head-inner { max-width: 980px; margin: 0 auto; }
  .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: .5px; margin-right: auto; }
  .logo small { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
  select, input[type="text"], .unk-input, .srs-add-row input {
    border: none; border-radius: 10px; padding: 8px 10px; font-size: 14px; outline: none; background: #fff; color: var(--text);
  }
  #lessonSel { max-width: 300px; }
  .btn {
    border: none; cursor: pointer; border-radius: 12px; padding: 9px 16px;
    font-size: 14px; font-weight: 600; transition: transform .08s, box-shadow .15s, background .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 3px 8px rgba(79,110,247,.3); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled, .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: #eef1fb; color: var(--primary-dark); }
  .btn-ghost:hover { background: #e2e8fc; }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; }
  .btn-sound {
    border: none; background: #eef1fb; color: var(--primary-dark); cursor: pointer;
    border-radius: 50%; width: 30px; height: 30px; font-size: 14px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; vertical-align: middle;
  }
  .btn-sound:hover { background: #dfe6fb; }
  .rate-box { display: flex; align-items: center; gap: 6px; font-size: 12.5px; background: rgba(255,255,255,.18); border-radius: 12px; padding: 6px 10px; }
  .rate-box input { width: 90px; }
  .switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; }
  header .switch { color: #fff; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: none; cursor: pointer; background: rgba(255,255,255,.16); color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
  }
  .tab.active { background: #fff; color: var(--primary-dark); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 14px 60px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(36,48,68,.06);
  }
  .tab-head { display: flex; flex-direction: column; gap: 8px; }
  .tab-title { font-size: 18px; font-weight: 700; }
  .badge {
    background: #eef1fb; color: var(--primary-dark); font-size: 12px; font-weight: 700;
    padding: 2px 9px; border-radius: 999px; vertical-align: middle;
  }
  .badge.social { background: #fdeeee; color: #d24b3f; }
  .badge.core { background: #fff4dd; color: #b26b00; }
  .hint { color: var(--muted); font-size: 13px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .lesson-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .lesson-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sec-title { font-weight: 700; font-size: 15.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .line { padding: 5px 0; }
  .line-en { display: flex; align-items: baseline; font-size: 15px; }
  .line-zh { color: var(--muted); font-size: 13.5px; margin: 2px 0 0 38px; }
  .q-line { background: #f6f8ff; border-radius: 10px; padding: 6px 10px; margin: 4px 0; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .word-card { display: flex; flex-direction: column; gap: 4px; margin-bottom: 0; }
  .w-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .w-en { font-weight: 700; font-size: 16px; color: var(--primary-dark); }
  .w-pos { color: var(--muted); font-size: 12px; min-height: 16px; }
  .w-zh { font-size: 15px; }
  .w-ex { color: var(--muted); font-size: 13px; display: flex; align-items: flex-start; }
  .w-ex i { color: #a5b0bf; font-style: normal; }
  .w-foot { margin-top: 4px; }
  .pattern-zh { color: var(--primary-dark); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .grammar-body { font-size: 14.5px; margin-bottom: 6px; }
  .rules { margin: 6px 0 6px 20px; font-size: 14px; }
  .rules li { margin: 3px 0; }
  .tip { background: #fff8ea; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: #8a6410; }
  .quiz-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .quiz-title { font-weight: 700; font-size: 15.5px; margin-right: auto; }
  .quiz-count { color: var(--muted); font-size: 13px; }
  .progress { height: 8px; background: #e6eaf5; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress .bar { height: 100%; background: linear-gradient(90deg, var(--primary), #8aa4ff); border-radius: 999px; transition: width .25s; }
  .quiz-card .q-prompt { font-size: 19px; font-weight: 700; margin-bottom: 6px; white-space: pre-wrap; }
  .quiz-card .q-sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .q-audio { margin-bottom: 12px; }
  .q-audio .btn-sound { width: 42px; height: 42px; font-size: 20px; margin: 0; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    border: 2px solid #e3e8f5; background: #fff; border-radius: 12px; padding: 11px 14px;
    font-size: 15px; cursor: pointer; transition: border .12s, background .12s;
  }
  .opt:hover { border-color: var(--primary); }
  .opt-key {
    flex: none; width: 26px; height: 26px; border-radius: 50%; background: #eef1fb; color: var(--primary-dark);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .opt-right { border-color: var(--ok); background: var(--ok-bg); }
  .opt-right .opt-key { background: var(--ok); color: #fff; }
  .opt-wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt-wrong .opt-key { background: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }
  .opt-tried { opacity: .55; }
  .opt-tried:disabled { border-color: #e3e8f5; background: #f7f8fc; }
  .opt-hit { border-color: #ff9f43 !important; background: #fff4e6 !important; animation: optHit .5s ease; }
  @keyframes optHit {
    0% { transform: scale(1); }
    25% { transform: scale(1.04) rotate(-.6deg); }
    55% { transform: scale(.985) rotate(.5deg); }
    100% { transform: scale(1); }
  }
  /* ---------- 大炮射击 ---------- */
  .quiz-card { position: relative; }
  .cannon-layer { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: visible; }
  .cannon-wrap { display: flex; justify-content: center; margin: 6px 0 10px; transition: transform .1s; }
  .cannon { position: relative; width: 92px; height: 62px; }
  .cannon-barrel {
    position: absolute; left: 18px; top: 12px; width: 56px; height: 17px; border-radius: 5px;
    background: linear-gradient(180deg, #6b7a9c, #3c4864); transform-origin: 4px 50%;
    transform: rotate(90deg); box-shadow: 0 2px 5px rgba(24,35,66,.28);
    transition: transform .18s ease-out;
  }
  .cannon-barrel::after {
    content: ""; position: absolute; right: -3px; top: -2px; width: 6px; height: 21px;
    border-radius: 3px; background: #2a3348;
  }
  .cannon-wheel {
    position: absolute; left: 0; bottom: 2px; width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #8aa0c8 0 26%, #55658b 27% 44%, #38425c 45% 100%);
    border: 3px solid #2f3850; box-shadow: 0 3px 8px rgba(24,35,66,.3);
  }
  .cannon-ball {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #6e7c9c, #1f2740 70%);
    box-shadow: 0 0 8px rgba(255,159,67,.65);
    animation-name: cannonFly; animation-timing-function: cubic-bezier(.3,.7,.6,1); animation-fill-mode: forwards;
  }
  @keyframes cannonFly {
    0% { transform: translate(0, 0) scale(.75); opacity: .9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.05); opacity: 1; }
  }
  .cannon-boom {
    position: absolute; transform: translate(-50%, -50%); font-size: 30px; line-height: 1;
    animation: boomPop .5s ease-out forwards; pointer-events: none;
  }
  @keyframes boomPop {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    35% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -52%) scale(1.6); opacity: 0; }
  }
  .cannon-smoke {
    position: absolute; font-size: 18px; animation: smokeUp .6s ease-out forwards; pointer-events: none;
  }
  @keyframes smokeUp {
    0% { transform: translateY(0) scale(.7); opacity: .95; }
    100% { transform: translateY(-26px) scale(1.3); opacity: 0; }
  }
  .badge.human { background: #e8f6ef; color: #178a50; font-size: 11px; }
  .tb-btn { width: auto; border-radius: 999px; padding: 0 12px; height: 30px; font-size: 12.5px; background: #e8f6ef; color: #178a50; }
  .tb-btn:hover { background: #d7efe2; }
  .tb-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #eef0f8; }
  .tb-row:last-of-type { border-bottom: none; }
  .tb-row .btn-sound { width: 40px; height: 40px; margin: 0; font-size: 16px; }
  .tb-title { font-weight: 700; font-size: 14.5px; }
  .tb-zh { color: var(--muted); font-size: 12.5px; }
  .w-tbaudio { display: flex; align-items: center; gap: 4px; color: #178a50; font-size: 12.5px; margin-top: 4px; }
  .w-tbaudio .btn-sound { background: #e8f6ef; color: #178a50; }
  .table-wrap { overflow-x: auto; }

  /* ---------- 情景剧场（图文并排） ---------- */
  .scene-rail { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; }
  .scene-thumb {
    flex: 0 0 118px; background: #fff; border: 2px solid #e6eaf5; border-radius: 14px; padding: 0;
    overflow: hidden; cursor: pointer; text-align: left; scroll-snap-align: start;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .scene-thumb:hover { transform: translateY(-2px); }
  .scene-thumb.active { border-color: var(--primary); box-shadow: 0 4px 14px rgba(79,110,247,.25); }
  .scene-thumb .st-img { display: block; width: 100%; height: 64px; background-color: #eef1f8; }
  .scene-thumb .st-t { display: block; font-size: 11.5px; line-height: 1.3; padding: 6px 8px; color: #3a4a66; font-weight: 700; }

  .scene-main { padding: 14px; }
  .scene-main-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .scene-title { font-size: 16px; font-weight: 800; color: #22314f; }
  .scene-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .scene-split { display: flex; gap: 14px; align-items: stretch; }
  .scene-fig { flex: 0 0 46%; display: flex; flex-direction: column; gap: 6px; }
  .scene-img {
    width: 100%; aspect-ratio: var(--ar, 1.4); border-radius: 12px; background-color: #e8ecf6;
    box-shadow: 0 3px 12px rgba(30,45,80,.12); border: 1px solid #e3e8f4;
  }
  .scene-fig-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .scene-fig-note { font-size: 11px; color: var(--muted); }

  .scene-say { flex: 1 1 54%; display: flex; flex-direction: column; min-width: 0; }
  .scene-line {
    flex: 1 1 auto; background: var(--spbg); border-left: 4px solid var(--sp); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .scene-line-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .scene-spk { font-size: 12.5px; font-weight: 800; color: var(--sp); }
  .scene-en { font-size: 17px; font-weight: 700; color: #1e2a45; line-height: 1.4; }
  .scene-zh { font-size: 13.5px; color: #4a5a78; line-height: 1.45; }
  .scene-ctrl { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .scene-ctrl .btn { flex: 0 0 auto; }
  .scene-ctrl #scPlay { min-width: 92px; }

  .scene-dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0 14px; }
  .scene-dots .dot {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #dde3f0; background: #fff;
    color: #7b89a8; font-size: 12px; font-weight: 700; cursor: pointer; padding: 0;
  }
  .scene-dots .dot:hover { border-color: var(--primary); color: var(--primary); }
  .scene-dots .dot.on { background: var(--sp); border-color: var(--sp); color: #fff; }

  .dialogue-card .dialogue { display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 92%; cursor: pointer; }
  .bubble.left { align-self: flex-start; }
  .bubble.right { align-self: flex-end; }
  .bubble.narr { align-self: center; max-width: 98%; }
  .bubble .b-head { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; margin-bottom: 4px; }
  .bubble.right .b-head { flex-direction: row-reverse; }
  .bubble .b-body { display: flex; align-items: flex-start; gap: 8px; }
  .bubble.right .b-body { flex-direction: row-reverse; }
  .bubble.narr .b-body { justify-content: center; }
  .bubble .b-thumb {
    flex: 0 0 auto; width: 58px; height: 44px; border-radius: 8px; background-color: #e8ecf6;
    background-size: cover; background-position: center; border: 1px solid #e3e8f4;
  }
  .bubble .b-txt { display: flex; flex-direction: column; min-width: 0; }
  .bubble .b-en {
    padding: 8px 12px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; color: #22314f;
    border-top-left-radius: 4px;
  }
  .bubble.right .b-en { border-top-left-radius: 12px; border-top-right-radius: 4px; }
  .bubble.narr .b-en { border-radius: 10px; font-style: italic; text-align: center; }
  .bubble .b-zh { font-size: 12.5px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .bubble.on .b-en { box-shadow: 0 0 0 2px var(--primary) inset; }
  .btn-sound.mini { width: 26px; height: 26px; font-size: 12px; margin: 0; }

  /* 取景器 */
  .vf-wrap { display: flex; flex-direction: column; gap: 10px; }
  .vf-tip { background: #fff6e0; color: #8a6d00; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .vf-stage {
    position: relative; width: 100%; height: 58vh; overflow: hidden; border-radius: 14px;
    background: #1a2033; box-shadow: 0 6px 20px rgba(20,30,60,.22); touch-action: none; cursor: grab;
  }
  .vf-stage img { position: absolute; top: 0; left: 0; will-change: transform; user-select: none; -webkit-user-drag: none; }
  .vf-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .vf-bar input[type=range] { flex: 1; accent-color: var(--primary); }
  .vf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .vf-cell { padding: 8px 0; border: 1px solid #dfe5f2; background: #fff; border-radius: 9px; font-size: 13px; color: #3a4a66; cursor: pointer; }
  .vf-cell:hover { border-color: var(--primary); color: var(--primary); }
  .vf-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .vf-actions .btn { flex: 1 1 auto; }
  .vf-hint { font-size: 12px; color: var(--muted); }

  /* 课文卡片：配图条 + 图文并排行 */
  .sec-hero {
    width: 100%; height: 78px; border-radius: 12px; background-color: #e8ecf6; margin: 4px 0 12px;
    background-size: cover; background-position: center; border: 1px solid #e3e8f4;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
  }
  .line { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
  .line-thumb {
    flex: 0 0 auto; width: 78px; height: 46px; border-radius: 9px; background-color: #e8ecf6;
    background-size: cover; background-position: center; border: 1px solid #e3e8f4;
    box-shadow: 0 1px 4px rgba(30,45,80,.08);
  }
  .line-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .line-zh { padding-left: 38px; }

  .q-feedback { margin-top: 14px; border-radius: 12px; padding: 11px 14px; font-size: 14px; white-space: pre-wrap; }
  .fb-ok { background: var(--ok-bg); color: #17603f; }
  .fb-bad { background: var(--bad-bg); color: #8c2f26; }
  .fb-retry { background: #fff8ea; color: #8a6410; border: 1px dashed #f3d18a; animation: fbIn .28s ease-out; }
  .shake { animation: cardShake .45s ease; }
  @keyframes cardShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  @keyframes fbIn {
    0% { transform: translateY(6px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .q-actions { margin-top: 14px; display: flex; gap: 10px; }
  .q-actions.center { justify-content: center; }
  .hidden { display: none !important; }
  .reorder-ans {
    min-height: 52px; background: #f6f8ff; border: 2px dashed #c9d4f6; border-radius: 12px;
    padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .reorder-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chip {
    border: none; cursor: pointer; background: #eef1fb; color: var(--primary-dark);
    border-radius: 10px; padding: 7px 12px; font-size: 14.5px; font-weight: 600;
  }
  .chip:hover { background: #e0e7fd; }
  .chip-ans { background: var(--primary); color: #fff; }
  .chip-ans:hover { background: var(--primary-dark); }
  .order-area { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .order-area .chip { text-align: left; }
  .order-done { font-weight: 600; font-size: 14px; min-height: 22px; margin-bottom: 6px; }
  .quiz-end { text-align: center; padding: 26px 18px; }
  .qe-stars { font-size: 34px; color: var(--gold); letter-spacing: 4px; }
  .qe-score { font-size: 40px; font-weight: 800; color: var(--primary-dark); margin: 4px 0; }
  .qe-pct { color: var(--muted); margin-bottom: 12px; }
  .qe-hint { background: #f2f8ff; color: #3a5a8c; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
  .qe-perfect { color: var(--ok); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .qe-score-big {
    font-size: 62px; font-weight: 800; line-height: 1.05; margin: 2px 0 6px;
    background: linear-gradient(135deg, #ff8a3d, #ffb703 45%, #42b983);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: scorePop .7s cubic-bezier(.2,1.5,.5,1) both;
  }
  .qe-score-big span { font-size: 24px; font-weight: 700; margin-left: 4px; }
  @keyframes scorePop {
    0% { transform: scale(.5); opacity: 0; }
    60% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .qe-praise {
    display: inline-block; font-size: 17px; font-weight: 800; color: #b2540a;
    background: #fff4e0; border-radius: 999px; padding: 8px 18px; margin-bottom: 12px;
    animation: praiseBounce 1.4s ease-in-out .3s infinite;
  }
  @keyframes praiseBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  /* 满分彩带 */
  .confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9999; }
  .confetti {
    position: absolute; top: -18px; width: 9px; height: 14px; border-radius: 2px;
    animation-name: confettiFall; animation-timing-function: linear; animation-iteration-count: 1;

  border-radius: 16px; padding: 8px; background: #eef2fb; overflow: hidden; }
/* 卡片消除处的缝隙能看到底图，加深一点让"拼图感"更明显 */
.gm-board.has-bg::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0;
  background: rgba(15,30,60,.10); pointer-events: none; }
.gm-board > * { position: relative; z-index: 1; }
/* 有底图时：整张动物图铺在棋盘上，卡片盖住各自那一格，消除后露出原图 */
.gm-board.has-bg { background-image: var(--bg); background-size: cover; background-position: center; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.gm-card { position: relative; aspect-ratio: 1 / 1; border: 2px solid #dde5f8; border-radius: 14px; background: #fff;
  display: flex; align-items: center; justify-content: center; padding: 4px; cursor: pointer; overflow: hidden;
  transition: transform .12s ease, box-shadow .15s ease, opacity .32s ease, background .15s ease;
  -webkit-tap-highlight-color: transparent; user-select: none; }
.gm-card .gm-face { position: relative; z-index: 2; font-size: 15px; font-weight: 700; line-height: 1.25;
  word-break: break-word; text-align: center; }
/* 卡片一律纯色不透明，先看清字；底图只在卡片消除后才露出来 */
.gm-card.en { background: #dbe9ff; border-color: #a9c6f5; }
.gm-card.en .gm-face { color: #10386b; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; }
.gm-card.zh { background: #d5f5e4; border-color: #9cdcb8; }
.gm-card.zh .gm-face { color: #0d5737; }
.gm-card:not(.open) { background: #8fa2c4; border-color: #7d90b3; }
.gm-card:not(.open) .gm-face { color: #fff; font-size: 22px; font-weight: 800; }
/* 卡片消除后彻底透明，露出底下的动物图 */
.gm-board.has-bg .gm-card.gone { background: transparent; }
.gm-card:active { transform: scale(.94); }
.gm-card.sel { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 20px rgba(76,124,243,.34); border-color: #4c7cf3; z-index: 2; }
.gm-card.boom { animation: gmBoom .46s ease forwards; }
.gm-card.shake { animation: gmShake .5s ease; border-color: #e0483c; }
.gm-card.gone { background: transparent !important; border-color: transparent !important;
  opacity: 0; pointer-events: none; box-shadow: none; }
.gm-board.drift .gm-card:not(.gone) { animation: gmDrift 3.4s ease-in-out infinite; }
.gm-board.drift .gm-card:not(.gone):nth-child(2n) { animation-delay: .5s; }
.gm-board.drift .gm-card:not(.gone):nth-child(3n) { animation-delay: 1.1s; }
@keyframes gmDrift {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(2px,-3px); }
  66% { transform: translate(-2px,2px); }
}
@keyframes gmBoom {
  0% { transform: scale(1.05); }
  40% { transform: scale(1.16); box-shadow: 0 0 0 10px rgba(255,205,60,.5); }
  100% { transform: scale(.2) rotate(16deg); opacity: 0; }
}
@keyframes gmShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
}

<script>window.__appStarted = false;</script>
<script>
  /* 兜底（必须放在外部脚本之前，才能捕捉脚本下载失败） */
  window.__bootFails = [];
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (t && t.tagName === "SCRIPT") {
      window.__bootFails.push("脚本没能下载（" + (t.src || "").split("/").pop().split("?")[0] + "）");
      return;
    }
    if (e && e.message) window.__bootFails.push(String(e.message));
  }, true);
</script>
<script src="audio/manifest.js?v=20261026a"></script>
<script src="data.js?v=20261026a"></script>
<script src="app.js?v=20261026a"></script>
<script>
  /* 兜底：script 出错或初始化失败时，页面不能只剩一个头 */
  function __bootFail(msg) {
    var v = document.getElementById("view");
    if (!v || !v.querySelector(".loading")) return;
    if (window.__appStarted) return;
    v.innerHTML = '<div class="card" style="line-height:1.7">' +
      '<b>页面没能加载完成</b><br>' +
      '<span style="color:#7b8798;font-size:13px">原因：' + String(msg || "未知") + '</span><br>' +
      '<span style="color:#7b8798;font-size:13px">如果一直这样，请连上网络后点下面按钮重试。</span><br>' +
      '<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="__hardReload()">重新加载</button></div>';
  }
  /* 强制绕过缓存重载，解决 iPad 拿到旧版脚本的问题 */
  window.__hardReload = function () {
    try {
      var u = location.pathname + "?t=" + Date.now();
      location.replace(u);
    } catch (e) { location.reload(); }
  };
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (t && t.tagName !== "SCRIPT") __bootFail((e && e.message) || "未知错误");
  }, true);
  setTimeout(function () {
    var f = window.__bootFails || [];
    __bootFail(f.length ? f[f.length - 1] : "初始化超时，可能是网络较慢");
  }, 8000);
</script>
