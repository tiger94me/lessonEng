<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>课文随身学 · 英语课文讲解与练习</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --bg: #f2f5fc;
    --card: #ffffff;
    --text: #243044;
    --muted: #7b8798;
    --ok: #1f9d63;
    --ok-bg: #e5f7ee;
    --bad: #d24b3f;
    --bad-bg: #fdecea;
    --gold: #f5a623;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #4f6ef7 0%, #6f86ff 55%, #8aa4ff 100%);
    color: #fff; padding: 18px 16px 14px; box-shadow: 0 2px 10px rgba(79,110,247,.25);
  }
  .head-inner { max-width: 980px; margin: 0 auto; }
  .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: .5px; margin-right: auto; }
  .logo small { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
  select, input[type="text"], .unk-input, .srs-add-row input {
    border: none; border-radius: 10px; padding: 8px 10px; font-size: 14px; outline: none; background: #fff; color: var(--text);
  }
  #lessonSel { max-width: 300px; }
  .btn {
    border: none; cursor: pointer; border-radius: 12px; padding: 9px 16px;
    font-size: 14px; font-weight: 600; transition: transform .08s, box-shadow .15s, background .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 3px 8px rgba(79,110,247,.3); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled, .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: #eef1fb; color: var(--primary-dark); }
  .btn-ghost:hover { background: #e2e8fc; }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; }
  .btn-sound {
    border: none; background: #eef1fb; color: var(--primary-dark); cursor: pointer;
    border-radius: 50%; width: 30px; height: 30px; font-size: 14px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; vertical-align: middle;
  }
  .btn-sound:hover { background: #dfe6fb; }
  .rate-box { display: flex; align-items: center; gap: 6px; font-size: 12.5px; background: rgba(255,255,255,.18); border-radius: 12px; padding: 6px 10px; }
  .rate-box input { width: 90px; }
  .switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; }
  header .switch { color: #fff; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: none; cursor: pointer; background: rgba(255,255,255,.16); color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
  }
  .tab.active { background: #fff; color: var(--primary-dark); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 14px 60px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(36,48,68,.06);
  }
  .tab-head { display: flex; flex-direction: column; gap: 8px; }
  .tab-title { font-size: 18px; font-weight: 700; }
  .badge {
    background: #eef1fb; color: var(--primary-dark); font-size: 12px; font-weight: 700;
    padding: 2px 9px; border-radius: 999px; vertical-align: middle;
  }
  .badge.social { background: #fdeeee; color: #d24b3f; }
  .badge.core { background: #fff4dd; color: #b26b00; }
  .hint { color: var(--muted); font-size: 13px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .lesson-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .lesson-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .sec-title { font-weight: 700; font-size: 15.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .line { padding: 5px 0; }
  .line-en { display: flex; align-items: baseline; font-size: 15px; }
  .line-zh { color: var(--muted); font-size: 13.5px; margin: 2px 0 0 38px; }
  .q-line { background: #f6f8ff; border-radius: 10px; padding: 6px 10px; margin: 4px 0; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .word-card { display: flex; flex-direction: column; gap: 4px; margin-bottom: 0; }
  .w-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .w-en { font-weight: 700; font-size: 16px; color: var(--primary-dark); }
  .w-pos { color: var(--muted); font-size: 12px; min-height: 16px; }
  .w-zh { font-size: 15px; }
  .w-ex { color: var(--muted); font-size: 13px; display: flex; align-items: flex-start; }
  .w-ex i { color: #a5b0bf; font-style: normal; }
  .w-foot { margin-top: 4px; }
  .pattern-zh { color: var(--primary-dark); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .grammar-body { font-size: 14.5px; margin-bottom: 6px; }
  .rules { margin: 6px 0 6px 20px; font-size: 14px; }
  .rules li { margin: 3px 0; }
  .tip { background: #fff8ea; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: #8a6410; }
  .quiz-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .quiz-title { font-weight: 700; font-size: 15.5px; margin-right: auto; }
  .quiz-count { color: var(--muted); font-size: 13px; }
  .progress { height: 8px; background: #e6eaf5; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress .bar { height: 100%; background: linear-gradient(90deg, var(--primary), #8aa4ff); border-radius: 999px; transition: width .25s; }
  .quiz-card .q-prompt { font-size: 19px; font-weight: 700; margin-bottom: 6px; white-space: pre-wrap; }
  .quiz-card .q-sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .q-audio { margin-bottom: 12px; }
  .q-audio .btn-sound { width: 42px; height: 42px; font-size: 20px; margin: 0; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    border: 2px solid #e3e8f5; background: #fff; border-radius: 12px; padding: 11px 14px;
    font-size: 15px; cursor: pointer; transition: border .12s, background .12s;
  }
  .opt:hover { border-color: var(--primary); }
  .opt-key {
    flex: none; width: 26px; height: 26px; border-radius: 50%; background: #eef1fb; color: var(--primary-dark);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .opt-right { border-color: var(--ok); background: var(--ok-bg); }
  .opt-right .opt-key { background: var(--ok); color: #fff; }
  .opt-wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt-wrong .opt-key { background: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }
  .badge.human { background: #e8f6ef; color: #178a50; font-size: 11px; }
  .tb-btn { width: auto; border-radius: 999px; padding: 0 12px; height: 30px; font-size: 12.5px; background: #e8f6ef; color: #178a50; }
  .tb-btn:hover { background: #d7efe2; }
  .tb-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #eef0f8; }
  .tb-row:last-of-type { border-bottom: none; }
  .tb-row .btn-sound { width: 40px; height: 40px; margin: 0; font-size: 16px; }
  .tb-title { font-weight: 700; font-size: 14.5px; }
  .tb-zh { color: var(--muted); font-size: 12.5px; }
  .w-tbaudio { display: flex; align-items: center; gap: 4px; color: #178a50; font-size: 12.5px; margin-top: 4px; }
  .w-tbaudio .btn-sound { background: #e8f6ef; color: #178a50; }
  .table-wrap { overflow-x: auto; }
  .q-feedback { margin-top: 14px; border-radius: 12px; padding: 11px 14px; font-size: 14px; white-space: pre-wrap; }
  .fb-ok { background: var(--ok-bg); color: #17603f; }
  .fb-bad { background: var(--bad-bg); color: #8c2f26; }
  .q-actions { margin-top: 14px; display: flex; gap: 10px; }
  .q-actions.center { justify-content: center; }
  .hidden { display: none !important; }
  .reorder-ans {
    min-height: 52px; background: #f6f8ff; border: 2px dashed #c9d4f6; border-radius: 12px;
    padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .reorder-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chip {
    border: none; cursor: pointer; background: #eef1fb; color: var(--primary-dark);
    border-radius: 10px; padding: 7px 12px; font-size: 14.5px; font-weight: 600;
  }
  .chip:hover { background: #e0e7fd; }
  .chip-ans { background: var(--primary); color: #fff; }
  .chip-ans:hover { background: var(--primary-dark); }
  .order-area { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .order-area .chip { text-align: left; }
  .order-done { font-weight: 600; font-size: 14px; min-height: 22px; margin-bottom: 6px; }
  .quiz-end { text-align: center; padding: 26px 18px; }
  .qe-stars { font-size: 34px; color: var(--gold); letter-spacing: 4px; }
  .qe-score { font-size: 40px; font-weight: 800; color: var(--primary-dark); margin: 4px 0; }
  .qe-pct { color: var(--muted); margin-bottom: 12px; }
  .qe-perfect { color: var(--ok); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .qe-wrong { text-align: left; margin: 10px 0 6px; }
  .qe-wrong-title { font-weight: 700; margin-bottom: 8px; }
  .wrong-item { background: #fafbfe; border: 1px solid #edf0f8; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .wi-q { font-weight: 600; white-space: pre-wrap; }
  .wi-a { color: var(--ok); margin-top: 2px; white-space: pre-wrap; }
  .wi-e { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; }
  .wi-t { color: #b3bcc9; font-size: 12px; margin-top: 4px; }
  .srs-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .stat { background: #eef1fb; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--primary-dark); }
  .stat.hot { background: #fdeeea; color: #c0483c; }
  .stat.ok { background: #e5f7ee; color: #178a50; }
  .srs-add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .srs-add-row input { border: 1px solid #e3e8f5; flex: 1; min-width: 140px; }
  .srs-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .srs-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #edf0f8; }
  .srs-table td { padding: 7px 8px; border-bottom: 1px solid #f2f4fa; vertical-align: middle; }
  .srs-en { font-weight: 600; color: var(--primary-dark); white-space: pre-wrap; }
  .srs-en .btn-sound { width: 24px; height: 24px; font-size: 11px; margin-right: 6px; }
  .hot { color: #c0483c; font-weight: 600; }
  .ok { color: #178a50; font-weight: 600; }
  .unk-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; flex-wrap: wrap; }
  .unk-en { font-weight: 600; color: var(--primary-dark); min-width: 110px; }
  .unk-count { color: var(--muted); font-size: 12.5px; }
  .unk-input { border: 1px solid #e3e8f5; flex: 1; min-width: 160px; }
  .write-item { padding: 7px 0; border-bottom: 1px dashed #eef0f8; }
  .write-item:last-child { border-bottom: none; }
  .reveal-btn { margin: 2px 0 6px 38px; }
  .write-item .line-zh { margin-left: 38px; background: var(--ok-bg); color: #17603f; border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(20,28,45,.45); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 560px; }
  .modal h3 { margin-bottom: 8px; }
  .modal textarea {
    width: 100%; height: 220px; border: 1px solid #e3e8f5; border-radius: 12px; padding: 10px;
    font-size: 14px; font-family: inherit; resize: vertical; outline: none;
  }
  .modal textarea:focus { border-color: var(--primary); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: rgba(30,40,60,.92); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading { text-align: center; color: var(--muted); padding: 30px; }
  .btn, .opt, .chip, .tab, .btn-sound { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #btnSettings { display: none; }
  @media (max-width: 720px) {
    main { padding: 12px 10px 86px; }
    header { padding: 10px 12px 8px; position: sticky; top: 0; z-index: 20; }
    .logo { font-size: 15.5px; }
    .logo small { display: none; }
    .head-row { gap: 6px; }
    #lessonSel { flex: 1; min-width: 0; max-width: none; font-size: 13px; padding: 7px 8px; }
    #btnSettings { display: inline-block; }
    .settings-row { display: none; }
    .settings-row.show { display: flex; flex-wrap: wrap; gap: 8px; }
    #tabs {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      background: #fff; box-shadow: 0 -2px 12px rgba(36,48,68,.14);
      padding: 5px 4px calc(5px + env(safe-area-inset-bottom));
      gap: 2px; margin: 0; z-index: 30; overflow-x: auto;
    }
    .tab {
      flex: 1 0 19%; background: none; color: var(--muted); font-size: 11px; font-weight: 600;
      padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 10px; white-space: nowrap;
    }
    .tab .t-ico { font-size: 18px; }
    .tab.active { color: var(--primary-dark); background: #eef1fb; }
    .btn { padding: 11px 16px; font-size: 15px; }
    .btn-sound { width: 34px; height: 34px; font-size: 15px; }
    .opt { min-height: 50px; font-size: 16px; padding: 12px 14px; }
    .opt-key { width: 28px; height: 28px; font-size: 14px; }
    .q-prompt { font-size: 17.5px; }
    .line-en { font-size: 15.5px; }
    .line-zh { font-size: 14px; }
    .cards-grid { grid-template-columns: 1fr; }
    .chip { padding: 9px 13px; font-size: 15px; }
    .modal { max-height: 92vh; overflow: auto; }
    .w-en { font-size: 16.5px; }
    .srs-table { min-width: 560px; }
  }
  @media (max-width: 640px) {
    .logo { font-size: 17px; }
    #lessonSel { max-width: 100%; }
    .quiz-card .q-prompt { font-size: 17px; }
    .line-zh { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="head-row">
      <div class="logo">📚 课文随身学<small>英语课文讲解 · 出题测验 · 语音听读</small></div>
      <select id="lessonSel" title="选择课文"></select>
      <input type="file" id="fileInput" accept=".txt,.md,.pdf,.text,text/plain,application/pdf" class="hidden">
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="btnUpload" title="支持 txt / md / pdf">📤 上传课文</button>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="btnPaste">✏️ 粘贴文本</button>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="btnHome">🏠 首页</button>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" id="btnSettings" title="设置">⚙️</button>
    </div>
    <div id="tabs"></div>
    <div class="head-row settings-row" id="settingsRow" style="margin-top:6px">
      <div class="rate-box">🐌 语速 <input type="range" id="rateRange" min="0.5" max="1.3" step="0.02"><span id="rateVal"></span></div>
      <div class="rate-box">🔉 发音源
        <select id="voiceSel" style="padding:4px 6px;font-size:13px">
          <option value="auto">自动（推荐）</option>
          <option value="browser">浏览器语音</option>
          <option value="offline">离线音频包</option>
          <option value="online">在线发音</option>
        </select>
      </div>
      <label class="switch"><input type="checkbox" id="autoSpeak"> 听力题自动朗读</label>
    </div>
  </div>
</header>
<main>
  <div id="view"><div class="loading">加载中…</div></div>
</main>

<div class="modal-mask hidden" id="pasteModal">
  <div class="modal">
    <h3>✏️ 粘贴英语课文</h3>
    <p class="hint" style="margin-bottom:8px">把课文文本粘贴到下面（支持中英对照，将自动提取词汇、短语、句式并生成习题）。</p>
    <textarea id="pasteArea" placeholder="例如：
For Duoduo, Tutu is his best and only friend. He wants to play with Tutu, but Tutu is playing with two other boys."></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="pasteCancel">取消</button>
      <button class="btn btn-primary" id="pasteOk">解析并开始学习</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="scanModal">
  <div class="modal">
    <h3>📄 无法直接读取这份 PDF</h3>
    <p class="hint" id="scanMsg" style="margin-bottom:8px"></p>
    <p class="hint" style="margin-bottom:8px">两种解决办法：</p>
    <ol class="hint" style="margin:0 0 10px 18px">
      <li>用配套 OCR 工具把扫描版 PDF 转成 txt（在本机已装好依赖）：<br>
        <code id="scanCmd" style="background:#f2f5fc;border-radius:8px;padding:4px 8px;display:inline-block;margin-top:4px"></code><br>
        转换出 <b>同名 .txt</b> 后，再点「📤 上传课文」选择它即可。</li>
      <li>或者直接复制课文文本粘贴进来。</li>
    </ol>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="scanClose">我知道了</button>
      <button class="btn btn-primary" id="scanPaste">✏️ 粘贴文本</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="audio/manifest.js"></script>
<script src="pdfjs/pdf.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
